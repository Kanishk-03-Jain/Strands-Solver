<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strands Solver</title>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: 'karnak-normal-400', 'Georgia', serif; /* Attempts to match NYT font */
      text-align: center;
      background-color: #f8f8f8;
      color: #333;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 5px;
      margin-top: 0;
    }

    p {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
      font-family: sans-serif;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #333;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 12px;
      font-family: sans-serif;
      min-height: 20px;
    }

    .success { color: green; }
    .error { color: red; }
    .loading { color: #007bff; }
  </style>
</head>
<body>

  <h1>Strands Solver</h1>
  <p>Open the game and click Solve.</p>

  <button id="solveBtn">⚡ Solve Puzzle</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
